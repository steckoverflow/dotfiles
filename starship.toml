"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'

# ── Left: dir → git → languages → gcloud → date/time ─────────────
format = """
[](peach)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$python\
${custom.uv}\
$golang\
$nodejs\
[](fg:green bg:sapphire)\
${custom.gcloud}\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$character"""

# ── Right: duration → cpu → mem → disk → slack ───────────────────
right_format = """
$cmd_duration\
[](fg:surface0)\
${custom.cpu}\
$memory_usage\
${custom.disk}\
${custom.slack}\
[](fg:surface0)"""

# ── Left segments ────────────────────────────────────────────────
[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Code" = "󰲋 "

[git_branch]
symbol = ""
format = '[ $symbol $branch ](fg:crust bg:yellow)'

[git_status]
format = '[($all_status$ahead_behind )](fg:crust bg:yellow)'

# Python: only when a venv is active; version comes from pyenv
[python]
symbol = ""
pyenv_version_name = true
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]
format = '[ $symbol( $version)( \($virtualenv\)) ](fg:crust bg:green)'

# uv: marker when uv.lock exists here or in any parent dir
[custom.uv]
when = 'd="$PWD"; while [ -n "$d" ]; do [ -f "$d/uv.lock" ] && exit 0; d="${d%/*}"; done; exit 1'
shell = ["bash", "--noprofile", "--norc"]
format = '[ uv ](fg:crust bg:green)'

[golang]
symbol = ""
format = '[ $symbol( $version) ](fg:crust bg:green)'

[nodejs]
symbol = ""
format = '[ $symbol( $version) ](fg:crust bg:green)'

# gcloud: custom so own account shows as a person icon instead of the email
[custom.gcloud]
command = "bash ~/.config/scripts/starship-gcloud.sh"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
format = '[ 󱇶 $output ](fg:crust bg:sapphire)'

[time]
disabled = false
time_format = "%a %d %b %R"
format = '[ 󰃰 $time ](fg:crust bg:lavender)'

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[line_break]
disabled = true

# ── Right segments (dark surface0 bg, colored text) ──────────────
[cmd_duration]
show_milliseconds = true
format = '[ $duration ](fg:overlay1)'
show_notifications = true
min_time_to_notify = 45000

[custom.cpu]
command = "bash ~/.config/scripts/starship-sys.sh cpu"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
format = '[  $output ](fg:mauve bg:surface0)'

[memory_usage]
disabled = false
threshold = -1
symbol = "󰍛"
format = '[ $symbol $ram_pct ](fg:blue bg:surface0)'

[custom.disk]
command = "bash ~/.config/scripts/starship-sys.sh disk"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
format = '[ 󰋊 $output ](fg:teal bg:surface0)'

[custom.slack]
command = "bash ~/.config/scripts/starship-slack.sh"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
format = '[ $output ](bg:surface0)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
